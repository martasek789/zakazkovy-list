<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f4d2b"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Zakázky"><title>Zakázkový list</title>
<style>
:root{--bg:#e4ece0;--card:#fbfdf9;--ink:#1d2a1f;--mut:#5b6b5e;--g:#1f4d2b;--gl:#cfdcc9;--in:#e9efe5;--bd:#b9c9b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1b261e;--ink:#e8f0e6;--mut:#9fb2a2;--g:#4c9a62;--gl:#2a3b2e;--in:#243228;--bd:#38503d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
.wrap{max-width:480px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--gl)}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
.logo{display:flex;flex-direction:column;align-items:center;color:var(--g);font-weight:700}
.logo small{font-size:9px;letter-spacing:.3px}
.top{display:flex;gap:10px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.top label{display:flex;align-items:center;gap:8px;font-weight:500}
.top input{width:100px}
.card{background:var(--card);margin:12px 14px;padding:14px;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
h2{font-size:16px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.3px}
.row{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;align-items:center;margin:8px 0}
.row.h{grid-template-columns:1fr 84px}
.row label{color:var(--ink)}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--g)}
textarea{min-height:96px;resize:vertical}
.stav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.stav b{font-weight:500;margin-right:auto}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sw input{display:none}
.sw i{width:46px;height:26px;border-radius:13px;background:var(--bd);position:relative;transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--g)}
.sw input:checked+i:after{left:23px}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sig span{display:flex;justify-content:space-between;font-weight:500;margin-bottom:4px}
.sig button{border:0;background:none;color:var(--g);font:inherit;font-size:13px;cursor:pointer}
canvas{width:100%;height:90px;background:var(--in);border:1px solid var(--bd);border-radius:10px;touch-action:none;display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--g);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:#fff;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav svg{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo"><svg width="92" height="34" viewBox="0 0 92 34"><rect width="92" height="26" rx="2" fill="currentColor"/><text x="46" y="20" font-size="19" font-weight="900" fill="#fff" text-anchor="middle" font-family="Arial Black,Arial,sans-serif">RK</text></svg><small>REEL KLADNO s.r.o.</small></div>
<h1>ZAKÁZKOVÝ LIST</h1>
</header>
<div class="top">
<label>Číslo ZL: <input id="cislo" inputmode="numeric"></label>
<label>Ze dne: <input id="datum"></label>
</div>

<section class="card">
<h2>Údaje o zákazníkovi</h2>
<div class="row"><label for="objednavka">Objednávka č.:</label><input id="objednavka"></div>
<div class="row"><label for="zakaznik">Zákazník:</label><input id="zakaznik"></div>
<div class="row"><label for="adresa">Adresa:</label><input id="adresa"></div>
<div class="stav"><b>Stav:</b>
<span>Rozpracováno</span>
<label class="sw"><input type="checkbox" id="hotovo"><i></i>Hotovo</label></div>
</section>

<section class="card">
<h2>Technik a práce</h2>
<div class="row"><label for="technik">Technik:</label><select id="technik"><option value="">Vyberte technika…</option><option>Košťák</option><option>Suchý</option><option>Bárta</option></select></div>
<div class="row h"><label>Práce elektro (hod)</label><input id="elektro" inputmode="decimal"></div>
<div class="row h"><label>Diagnostika, servis (hod)</label><input id="diagnostika" inputmode="decimal"></div>
<div class="row h"><label>Programování (hod)</label><input id="programovani" inputmode="decimal"></div>
<div class="row h"><label>Technická příprava (hod)</label><input id="priprava" inputmode="decimal"></div>
<div class="row h"><label>Koordinace zakázky (hod)</label><input id="koordinace" inputmode="decimal"></div>
<div class="row h"><label>Čas na dopravě (hod)</label><input id="cas" inputmode="decimal"></div>
<div class="row h"><label>Doprava (km)</label><input id="doprava" inputmode="decimal" placeholder="km"></div>
<label for="popis" style="display:block;margin:12px 0 4px">Popis práce, materiál, požadavky:</label>
<textarea id="popis"></textarea>
</section>

<section class="card">
<h2>Podpisy</h2>
<div class="sigs">
<div class="sig"><span>Technik: <button data-c="s1">smazat</button></span><canvas id="s1"></canvas></div>
<div class="sig"><span>Zákazník: <button data-c="s2">smazat</button></span><canvas id="s2"></canvas></div>
</div>
</section>
</div>

<nav>
<button id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3M8 21v-7h8v7"/></svg>Stáhnout</button>
<button id="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 3 3 10l7 3 3 7z"/><path d="m10 13 11-10"/></svg>Odeslat</button>
</nav>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const F=["cislo","datum","objednavka","zakaznik","adresa","technik","elektro","diagnostika","programovani","priprava","koordinace","cas","doprava","popis"];
const KEY="zakazkovy-list-v1";
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)};
const d=new Date();$("datum").value=d.getDate()+"."+(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2);

function pad(c){
  const x=c.getContext("2d");let down=false;
  const fit=()=>{const r=c.getBoundingClientRect(),k=devicePixelRatio||1,img=c.width?c.toDataURL():null;c.width=r.width*k;c.height=r.height*k;x.scale(k,k);x.lineWidth=2;x.lineCap="round";x.strokeStyle=getComputedStyle(document.body).color;c._k=k;
    if(img){const i=new Image();i.onload=()=>x.drawImage(i,0,0,r.width,r.height);i.src=img}};
  fit();
  const p=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e));c._has=true};
  c.onpointermove=e=>{if(down){x.lineTo(...p(e));x.stroke()}};
  c.onpointerup=c.onpointercancel=()=>down=false;
  c.clear=()=>{x.clearRect(0,0,c.width,c.height);c._has=false};
}
const S=[$("s1"),$("s2")];S.forEach(pad);
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>$(b.dataset.c).clear());

function data(){const o={hotovo:$("hotovo").checked};F.forEach(f=>o[f]=$(f).value);o.s1=S[0]._has?S[0].toDataURL():"";o.s2=S[1]._has?S[1].toDataURL():"";return o}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(!o)return;F.forEach(f=>{if(o[f]!=null)$(f).value=o[f]});$("hotovo").checked=!!o.hotovo;
  [o.s1,o.s2].forEach((s,i)=>{if(!s)return;const im=new Image();im.onload=()=>{const c=S[i],r=c.getBoundingClientRect();c.getContext("2d").drawImage(im,0,0,r.width,r.height);c._has=true};im.src=s})}catch(e){}}
load();

const loadImg=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
async function buildPDF(o){
  const W=1240,H=1754,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const G="#1f4d2b",F="Arial,Helvetica,sans-serif";
  g.fillStyle="#fff";g.fillRect(0,0,W,H);
  g.fillStyle="#e4ece0";g.fillRect(0,0,W,170);
  g.fillStyle=G;g.fillRect(70,40,200,76);g.fillStyle="#fff";g.font="900 54px "+F;g.textAlign="center";g.fillText("RK",170,98);
  g.fillStyle=G;g.font="bold 19px "+F;g.fillText("REEL KLADNO s.r.o.",170,146);
  g.textAlign="left";g.fillStyle="#1d2a1f";g.font="bold 54px "+F;g.fillText("ZAKÁZKOVÝ LIST",420,104);
  const lab=(t,x,y)=>{g.fillStyle="#5b6b5e";g.font="27px "+F;g.fillText(t,x,y)};
  const val=(t,x,y,mw)=>{g.fillStyle="#000";g.font="bold 29px "+F;g.fillText(t||"",x,y,mw)};
  const ln=y=>{g.strokeStyle="#b9c9b3";g.lineWidth=2;g.beginPath();g.moveTo(70,y+12);g.lineTo(1170,y+12);g.stroke()};
  const sec=(t,y)=>{g.fillStyle=G;g.font="bold 31px "+F;g.fillText(t.toUpperCase(),70,y);g.fillStyle=G;g.fillRect(70,y+14,1100,3)};
  const row=(l,v,y)=>{lab(l,70,y);val(v,560,y,610);ln(y)};
  lab("Číslo ZL:",70,245);val(o.cislo,230,245,300);lab("Ze dne:",640,245);val(o.datum,780,245,350);
  sec("Údaje o zákazníkovi",320);
  row("Objednávka č.:",o.objednavka,380);row("Zákazník:",o.zakaznik,436);row("Adresa:",o.adresa,492);
  lab("Stav:",70,548);g.fillStyle=o.hotovo?G:"#b26a00";g.font="bold 29px "+F;g.fillText(o.hotovo?"HOTOVO":"ROZPRACOVÁNO",560,548);ln(548);
  sec("Technik a práce",630);
  row("Technik:",o.technik,690);
  [["Práce elektro (hod)","elektro"],["Diagnostika, servis (hod)","diagnostika"],["Programování (hod)","programovani"],["Technická příprava (hod)","priprava"],["Koordinace zakázky (hod)","koordinace"],["Čas na dopravě (hod)","cas"],["Doprava (km)","doprava"]].forEach((a,i)=>row(a[0],o[a[1]],746+i*54));
  lab("Popis práce, materiál, požadavky:",70,1150);
  g.strokeStyle="#b9c9b3";g.lineWidth=2;g.strokeRect(70,1170,1100,200);
  g.fillStyle="#000";g.font="28px "+F;
  let y=1210;const lines=[];
  String(o.popis||"").split("\n").forEach(p=>{let l="";p.split(" ").forEach(w=>{const t=l?l+" "+w:w;if(g.measureText(t).width>1060&&l){lines.push(l);l=w}else l=t});lines.push(l)});
  lines.slice(0,5).forEach(t=>{g.fillText(t,86,y);y+=36});
  sec("Podpisy",1430);
  lab("Technik:",70,1490);lab("Zákazník:",650,1490);
  g.strokeRect(70,1505,520,170);g.strokeRect(650,1505,520,170);
  const imgs=await Promise.all([loadImg(o.s1),loadImg(o.s2)]);
  imgs.forEach((im,i)=>{if(!im)return;const t=document.createElement("canvas");t.width=im.width;t.height=im.height;const x=t.getContext("2d");x.drawImage(im,0,0);x.globalCompositeOperation="source-in";x.fillStyle="#111";x.fillRect(0,0,t.width,t.height);
    const bx=i?650:70,r=Math.min(500/t.width,150/t.height);g.drawImage(t,bx+10,1515,t.width*r,t.height*r)});
  g.fillStyle="#5b6b5e";g.font="20px "+F;g.fillText("Vytvořeno "+new Date().toLocaleString("cs-CZ"),70,1720);
  const b=atob(c.toDataURL("image/jpeg",.92).split(",")[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  window._jpg=new Blob([u],{type:"image/jpeg"});return mkPdf(u,W,H);
}
function mkPdf(jpg,w,h){
  const e=new TextEncoder(),parts=[],off=[];let len=0;
  const add=b=>{if(typeof b==="string")b=e.encode(b);parts.push(b);len+=b.length};
  const obj=(n,s)=>{off[n]=len;add(n+" 0 obj\n"+s+"\nendobj\n")};
  add("%PDF-1.4\n");
  obj(1,"<</Type/Catalog/Pages 2 0 R>>");
  obj(2,"<</Type/Pages/Kids[3 0 R]/Count 1>>");
  obj(3,"<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>");
  off[4]=len;add("4 0 obj\n<</Type/XObject/Subtype/Image/Width "+w+"/Height "+h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>\nstream\n");add(jpg);add("\nendstream\nendobj\n");
  const cs="q 595.28 0 0 841.89 0 0 cm /I Do Q";
  obj(5,"<</Length "+cs.length+">>\nstream\n"+cs+"\nendstream");
  const x=len;let t="xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<=5;i++)t+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  add(t+"trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n"+x+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
const fname=o=>"Zakazkovy-list-"+(o.cislo||"bez-cisla").replace(/[^\w-]+/g,"_")+".pdf";
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
const PRIJEMCE="";
const CSVH=["CisloZL","Datum","Objednavka","Zakaznik","Adresa","Stav","Technik","PraceElektro","Diagnostika","Programovani","TechPriprava","Koordinace","CasDoprava","DopravaKm","Popis","Vytvoreno"];
const cTxt=v=>String(v||"").replace(/[\r\n]+/g," / ").replace(/;/g,",").replace(/"/g,"'").trim();
const cNum=v=>String(v||"").trim().replace(".",",");
function cDat(s){const m=String(s||"").trim().match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{2,4})$/);if(!m)return cTxt(s);let y=+m[3];if(y<100)y+=2000;return m[1].padStart(2,"0")+"."+m[2].padStart(2,"0")+"."+y}
function buildCSV(o){
  const d=new Date(),p=n=>String(n).padStart(2,"0"),now=p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes());
  const r=[cTxt(o.cislo),cDat(o.datum),cTxt(o.objednavka),cTxt(o.zakaznik),cTxt(o.adresa),o.hotovo?"Hotovo":"Rozpracováno",cTxt(o.technik),cNum(o.elektro),cNum(o.diagnostika),cNum(o.programovani),cNum(o.priprava),cNum(o.koordinace),cNum(o.cas),cNum(o.doprava),cTxt(o.popis),now];
  return new Blob(["\uFEFF"+CSVH.join(";")+"\r\n"+r.join(";")+"\r\n"],{type:"text/csv;charset=utf-8"});
}
const csvName=n=>n.replace(/\.pdf$/,".csv");
$("save").onclick=async()=>{
  try{localStorage.setItem(KEY,JSON.stringify(data()))}catch(e){}
  try{const o=data(),n=fname(o),pdf=await buildPDF(o);dl(pdf,n);setTimeout(()=>dl(window._jpg,n.replace(/\.pdf$/,".jpg")),500);toast("Staženo: PDF + obrázek")}catch(e){toast("Export se nepodařil")}
};
$("send").onclick=async()=>{
  try{
    const o=data(),n=fname(o),pdf=await buildPDF(o),csv=buildCSV(o),subj="Zakázkový list "+(o.cislo||"");
    const fs=[new File([pdf],n,{type:"application/pdf"}),new File([csv],csvName(n),{type:"text/csv"})];
    let ok=false;
    if(navigator.canShare){for(const set of [fs,[fs[0]]]){if(navigator.canShare({files:set})){try{await navigator.share({files:set,title:subj,text:subj})}catch(e){}ok=true;break}}}
    if(!ok){dl(pdf,n);setTimeout(()=>dl(csv,csvName(n)),500);toast("Soubory staženy, přilož je k e-mailu");
      setTimeout(()=>{location.href="mailto:"+PRIJEMCE+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent("V příloze zakázkový list "+(o.cislo||"")+" (PDF a CSV pro import do Accessu).")},1500)}
  }catch(e){toast("Odeslání se nepodařilo")}
};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
