<style>
:root{--bg:#e4ece0;--card:#fbfdf9;--ink:#1d2a1f;--mut:#5b6b5e;--g:#1f4d2b;--gl:#cfdcc9;--in:#e9efe5;--bd:#b9c9b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1b261e;--ink:#e8f0e6;--mut:#9fb2a2;--g:#4c9a62;--gl:#2a3b2e;--in:#243228;--bd:#38503d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
.wrap{max-width:480px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--gl)}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
.logo{display:flex;flex-direction:column;align-items:center;color:var(--g);font-weight:700}
.logo small{font-size:9px;letter-spacing:.3px}
.top{display:flex;gap:10px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.top label{display:flex;align-items:center;gap:8px;font-weight:500}
.top input{width:100px}
.firma{background:var(--gl);margin-top:-4px;padding:0 16px 10px;font-size:12px;line-height:1.45;color:var(--mut)}
.card{background:var(--card);margin:12px 14px;padding:14px;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
h2{font-size:16px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.3px}
.row{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;align-items:center;margin:8px 0}
.row.h{grid-template-columns:1fr 84px}
.row label{color:var(--ink)}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--g)}
textarea{min-height:96px;resize:vertical}
.stav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.stav b{font-weight:500;margin-right:auto}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sw input{display:none}
.sw i{width:46px;height:26px;border-radius:13px;background:var(--bd);position:relative;transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--g)}
.sw input:checked+i:after{left:23px}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sig span{display:flex;justify-content:space-between;font-weight:500;margin-bottom:4px}
.sig button{border:0;background:none;color:var(--g);font:inherit;font-size:13px;cursor:pointer}
canvas{width:100%;height:90px;background:var(--in);border:1px solid var(--bd);border-radius:10px;touch-action:none;display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--g);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:#fff;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav svg{width:22px;height:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip input{display:none}.chip span{display:inline-block;padding:8px 12px;border:1px solid var(--bd);border-radius:18px;background:var(--in);cursor:pointer;user-select:none}.chip input:checked+span{background:var(--g);color:#fff;border-color:var(--g)}
.tb{border:1px solid var(--bd);border-left:4px solid var(--g);border-radius:10px;padding:4px 10px 6px;margin:10px 0}.tb h3{margin:6px 0 2px;font-size:15px;color:var(--g)}
.pw{position:relative}.pw canvas{cursor:pointer}
.pw .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;font-style:normal;pointer-events:none}
.pw.has .hint{display:none}
.ov{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column;padding:env(safe-area-inset-top,0px) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.ov.on{display:flex}
.ov .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.ov h3{margin:10px 0;font-size:18px}
.ov button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer}
.ov button.ok{background:var(--g);color:#fff;border-color:var(--g)}
#big{flex:1;min-height:0;height:auto;width:100%;margin-top:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const F=["cislo","datum","zakaznik","adresa","doprava","popis"];
const KEY="zakazkovy-list-v1";
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)};
const d=new Date();$("datum").value=d.getDate()+"."+(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2);

const S=[$("s1"),$("s2")];
function fitDraw(x,im,w,h){const r=Math.min(w/im.width,h/im.height),dw=im.width*r,dh=im.height*r;x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh)}
function prev(i){const c=S[i],k=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*k;c.height=r.height*k;const x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);c.parentNode.classList.toggle("has",!!c._has);
  if(c._full){const im=new Image();im.onload=()=>fitDraw(x,im,c.width,c.height);im.src=c._full}}
S.forEach((c,i)=>{c._full="";c._has=false;prev(i);c.onclick=()=>openSig(i)});
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const i=+b.dataset.c;S[i]._full="";S[i]._has=false;prev(i)});
const big=$("big"),bx=big.getContext("2d");let cur=0,bigHas=false,dn=false;
function sizeBig(){const snap=bigHas?big.toDataURL():null,r=big.getBoundingClientRect(),k=devicePixelRatio||1;big.width=r.width*k;big.height=r.height*k;
  bx.setTransform(1,0,0,1,0,0);bx.lineWidth=3.5*k;bx.lineCap="round";bx.lineJoin="round";bx.strokeStyle=getComputedStyle(document.body).color;
  if(snap){const im=new Image();im.onload=()=>fitDraw(bx,im,big.width,big.height);im.src=snap}}
function openSig(i){cur=i;bigHas=false;$("ovt").textContent=i?"Podpis zákazníka":"Podpis technika";$("ov").classList.add("on");
  requestAnimationFrame(()=>{sizeBig();if(S[i]._full){const im=new Image();im.onload=()=>{fitDraw(bx,im,big.width,big.height);bigHas=true};im.src=S[i]._full}})}
const bp=e=>{const r=big.getBoundingClientRect(),k=devicePixelRatio||1;return[(e.clientX-r.left)*k,(e.clientY-r.top)*k]};
big.onpointerdown=e=>{dn=true;big.setPointerCapture(e.pointerId);const q=bp(e);bx.beginPath();bx.moveTo(...q);bx.lineTo(q[0]+.1,q[1]);bx.stroke();bx.beginPath();bx.moveTo(...q);bigHas=true};
big.onpointermove=e=>{if(!dn)return;const q=bp(e);bx.lineTo(...q);bx.stroke();bx.beginPath();bx.moveTo(...q)};
big.onpointerup=big.onpointercancel=()=>dn=false;
function cropSig(c){const w=c.width,h=c.height,d=c.getContext("2d").getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<x0)return"";const p=12;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w-1,x1+p);y1=Math.min(h-1,y1+p);
  const t=document.createElement("canvas");t.width=x1-x0+1;t.height=y1-y0+1;t.getContext("2d").drawImage(c,x0,y0,t.width,t.height,0,0,t.width,t.height);return t.toDataURL()}

TECH.forEach((n,i)=>{
  const l=document.createElement("label");l.className="chip";l.innerHTML='<input type="checkbox" data-i="'+i+'"><span>'+n+'</span>';$("technik").appendChild(l);

  b.innerHTML='<h3>'+n+'</h3>'+HF.map(f=>'<div class="row h"><label>'+f[1]+'</label><input data-t="'+i+'" data-f="'+f[0]+'" inputmode="decimal"></div>').join("");

function data(){const o={hotovo:$("hotovo").checked};F.forEach(f=>o[f]=$(f).value);o.technici=TECH.map((n,i)=>{const t={jmeno:n};HF.forEach(f=>t[f[0]]=document.querySelector('[data-t="'+i+'"][data-f="'+f[0]+'"]').value);return t}).filter((t,i)=>document.querySelector('#technik input[data-i="'+i+'"]').checked);o.technik=o.technici.map(t=>t.jmeno).join(", ");o.s1=S[0]._has?S[0]._full:"";o.s2=S[1]._has?S[1]._full:"";return o}
$("new").onclick=()=>{if(confirm("Vymazat formulář a začít nový list?"))location.reload()};

const loadImg=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
async function buildPDF(o){
  const W=1240,H=1754,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const G="#1f4d2b",F="Arial,Helvetica,sans-serif";const lg=await loadImg(document.querySelector(".logo img").src);
  g.fillStyle="#fff";g.fillRect(0,0,W,H);
  g.fillStyle="#e4ece0";g.fillRect(0,0,W,222);
  g.textAlign="center";if(lg)g.drawImage(lg,70,40,220,69);else{g.fillStyle=G;g.fillRect(70,40,220,69)}
  g.textAlign="left";g.fillStyle="#1d2a1f";g.font="22px "+F;g.fillText("REEL Kladno s.r.o. · K Hájovně 184, Lhota, 273 01",70,142);g.fillText("IČO: 25773721 · DIČ: CZ25773721",70,168);g.fillText("Tel.: 736 486 481, 312 246 464 · info@reelkladno.cz",70,194);
  g.textAlign="left";g.fillStyle="#1d2a1f";g.font="bold 54px "+F;g.fillText("ZAKÁZKOVÝ LIST",420,104);
  const lab=(t,x,y)=>{g.fillStyle="#5b6b5e";g.font="27px "+F;g.fillText(t,x,y)};
  const val=(t,x,y,mw)=>{g.fillStyle="#000";g.font="bold 29px "+F;g.fillText(t||"",x,y,mw)};
  const ln=y=>{g.strokeStyle="#b9c9b3";g.lineWidth=2;g.beginPath();g.moveTo(70,y+12);g.lineTo(1170,y+12);g.stroke()};
  const sec=(t,y)=>{g.fillStyle=G;g.font="bold 31px "+F;g.fillText(t.toUpperCase(),70,y);g.fillStyle=G;g.fillRect(70,y+14,1100,3)};
  const row=(l,v,y)=>{lab(l,70,y);val(v,560,y,610);ln(y)};
  lab("Číslo ZL:",70,275);val(o.cislo,230,275,300);lab("Ze dne:",640,275);val(o.datum,780,275,350);
  sec("Údaje o zákazníkovi",350);
  row("Zákazník:",o.zakaznik,410);row("Adresa:",o.adresa,466);
  lab("Stav:",70,522);g.fillStyle=o.hotovo?G:"#b26a00";g.font="bold 29px "+F;g.fillText(o.hotovo?"HOTOVO":"ROZPRACOVÁNO",560,522);ln(522);
  sec("Technik a práce",600);
  const T=o.technici||[],cw=Math.min(150,Math.floor(560/Math.max(T.length,1))),cx=j=>1170-(T.length-1-j)*cw;
  lab("Technik:",70,660);T.forEach((t,j)=>{g.fillStyle="#000";g.font="bold 26px "+F;g.textAlign="right";g.fillText(t.jmeno,cx(j),660)});g.textAlign="left";ln(660);
  HF.forEach((a,i)=>{const yy=716+i*50;lab(a[1],70,yy);T.forEach((t,j)=>{g.fillStyle="#000";g.font="bold 29px "+F;g.textAlign="right";g.fillText(t[a[0]]||"",cx(j),yy)});g.textAlign="left";ln(yy)});
  row("Doprava (km)",o.doprava,716+HF.length*50);
  lab("Popis práce, materiál, požadavky:",70,1120);
  g.strokeStyle="#b9c9b3";g.lineWidth=2;g.strokeRect(70,1140,1100,200);
  g.fillStyle="#000";g.font="28px "+F;
  let y=1180;const lines=[];
  String(o.popis||"").split("\n").forEach(p=>{let l="";p.split(" ").forEach(w=>{const t=l?l+" "+w:w;if(g.measureText(t).width>1060&&l){lines.push(l);l=w}else l=t});lines.push(l)});
  lines.slice(0,5).forEach(t=>{g.fillText(t,86,y);y+=36});
  sec("Podpisy",1400);
  lab("Technik:",70,1460);lab("Zákazník:",650,1460);
  g.strokeRect(70,1475,520,170);g.strokeRect(650,1475,520,170);
  const imgs=await Promise.all([loadImg(o.s1),loadImg(o.s2)]);
  imgs.forEach((im,i)=>{if(!im)return;const t=document.createElement("canvas");t.width=im.width;t.height=im.height;const x=t.getContext("2d");x.drawImage(im,0,0);x.globalCompositeOperation="source-in";x.fillStyle="#111";x.fillRect(0,0,t.width,t.height);
    const bx=i?650:70,r=Math.min(500/t.width,150/t.height);g.drawImage(t,bx+10,1485,t.width*r,t.height*r)});
  g.fillStyle="#5b6b5e";g.font="20px "+F;g.fillText("Vytvořeno "+new Date().toLocaleString("cs-CZ"),70,1720);
  const b=atob(c.toDataURL("image/jpeg",.92).split(",")[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  window._jpg=new Blob([u],{type:"image/jpeg"});return mkPdf(u,W,H);
}
function mkPdf(jpg,w,h){
  const e=new TextEncoder(),parts=[],off=[];let len=0;
  const add=b=>{if(typeof b==="string")b=e.encode(b);parts.push(b);len+=b.length};
  const obj=(n,s)=>{off[n]=len;add(n+" 0 obj\n"+s+"\nendobj\n")};
  add("%PDF-1.4\n");
  obj(1,"<</Type/Catalog/Pages 2 0 R>>");
  obj(2,"<</Type/Pages/Kids[3 0 R]/Count 1>>");
  obj(3,"<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>");
  off[4]=len;add("4 0 obj\n<</Type/XObject/Subtype/Image/Width "+w+"/Height "+h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>\nstream\n");add(jpg);add("\nendstream\nendobj\n");
  const cs="q 595.28 0 0 841.89 0 0 cm /I Do Q";
  obj(5,"<</Length "+cs.length+">>\nstream\n"+cs+"\nendstream");
  const x=len;let t="xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<=5;i++)t+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  add(t+"trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n"+x+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
const fname=o=>"Zakazkovy-list-"+(o.cislo||"bez-cisla").replace(/[^\w-]+/g,"_")+".pdf";
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
const PRIJEMCE="";
$("save").onclick=async()=>{
    try{const o=data(),n=fname(o),pdf=await buildPDF(o);dl(pdf,n);setTimeout(()=>dl(window._jpg,n.replace(/\.pdf$/,".jpg")),500);toast("Staženo: PDF + obrázek")}catch(e){toast("Export se nepodařil")}
};
$("send").onclick=async()=>{
  try{
    const o=data(),n=fname(o),pdf=await buildPDF(o),subj="Zakázkový list "+(o.cislo||"");
    const f=new File([pdf],n,{type:"application/pdf"});
    let ok=false;
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:subj,text:subj})}catch(e){}ok=true}
    if(!ok){dl(pdf,n);toast("PDF staženo, přilož ho k e-mailu");
      setTimeout(()=>{location.href="mailto:"+PRIJEMCE+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent("V příloze zakázkový list "+(o.cislo||"")+".")},1500)}
  }catch(e){toast("Odeslání se nepodařilo")}
};
